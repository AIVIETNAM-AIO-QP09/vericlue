# Gốc workspace Python của VeriClue (quản lý bằng uv).

[project]
name = "vericlue-workspace"
version = "0.1.0"
description = "VeriClue — Data for Life 2026 (DS@AInSec4E)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "httpx>=0.27",
  # Chỉ để test logic tiền xử lý GenD (to_tensor) chạy được ở CI mà không cần torch (extra `gend`).
  "pillow>=10,<13",
]

# DATA-01: nhóm tùy chọn, không thuộc dependency chính API/ml.
data = [
  "numpy>=1.26",
  "scipy>=1.11,<2",
  "httpx>=0.27",
  "gdown>=5.2",
  "huggingface-hub>=0.26",
  "pyarrow>=17",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
# `cuda` thay thế `face`/`gend`/`voice`/`forensic` (torch CPU và onnxruntime vs onnxruntime-gpu không sống chung).
conflicts = [
  [{ package = "vericlue-ml", extra = "cuda" }, { package = "vericlue-ml", extra = "face" }],
  [{ package = "vericlue-ml", extra = "cuda" }, { package = "vericlue-ml", extra = "gend" }],
  [{ package = "vericlue-ml", extra = "cuda" }, { package = "vericlue-ml", extra = "voice" }],
  [{ package = "vericlue-ml", extra = "cuda" }, { package = "vericlue-ml", extra = "forensic" }],
]

[tool.uv.workspace]
members = ["services/api", "ml"]

# GPU (extra `cuda` của ml): torch/torchaudio từ index PyTorch CUDA 13; chỉ dùng khi chọn extra đó.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


# ── Ruff: định dạng + lint ─────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external", "data", "models", "notebooks", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dùng Depends(...) trong tham số hàm — đây là cách viết chuẩn của framework.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["vericlue_ml", "vericlue_api"]

[tool.ruff.format]
quote-style = "double"

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["scripts/tests", "services/api/tests", "ml/tests"]
addopts = "-q"
markers = ["slow: requires local model weights and audio; skips when unavailable"]
