services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ROUTER_PROFILE: ${ROUTER_PROFILE:-full}
      USE_MOCK_MODELS: ${USE_MOCK_MODELS:-true}
      SECURITY_PROFILE: ${SECURITY_PROFILE:-synthetic}
      PRODUCT_MODE: ${PRODUCT_MODE:-tools}
      REQUIRE_PRIVACY_CONSENT: ${REQUIRE_PRIVACY_CONSENT:-false}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-demo-v1}
      MAX_ID_CARD_SCANS: ${MAX_ID_CARD_SCANS:-5}
      MAX_ID_CARD_TOTAL_MB: ${MAX_ID_CARD_TOTAL_MB:-128}
      MAX_SESSION_MEDIA_MB: ${MAX_SESSION_MEDIA_MB:-256}
      MEDIA_TTL_UNVERIFIED_HOURS: ${MEDIA_TTL_UNVERIFIED_HOURS:-24}
      DEVICE: ${DEVICE:-cpu}
      LIPSYNC_DEVICE: ${LIPSYNC_DEVICE:-cpu}
      DETECTOR_TIMEOUT_SECONDS: ${DETECTOR_TIMEOUT_SECONDS:-4}
      DETECTOR_WORKERS: ${DETECTOR_WORKERS:-9}
      DETECTOR_QUEUE_SIZE: ${DETECTOR_QUEUE_SIZE:-3}
      INFERENCE_BUDGET_SECONDS: ${INFERENCE_BUDGET_SECONDS:-4.8}
      DB_LOCK_TIMEOUT_SECONDS: ${DB_LOCK_TIMEOUT_SECONDS:-2}
      MODELS_DIR: /models
      DATA_DIR: /data
      MEDIA_DIR: /media
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      MEDIA_TTL_PASS_HOURS: ${MEDIA_TTL_PASS_HOURS:-24}
      MEDIA_TTL_REVIEW_DAYS: ${MEDIA_TTL_REVIEW_DAYS:-30}
      MEDIA_TTL_INCOMPLETE_HOURS: ${MEDIA_TTL_INCOMPLETE_HOURS:-24}
      FORENSIC_TTL_DAYS: ${FORENSIC_TTL_DAYS:-}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-300}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-300}
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:-}
      STAFF_ACCESS_TOKENS: ${STAFF_ACCESS_TOKENS:-}
      REPORT_SIGNING_KEY_PATH: ${REPORT_SIGNING_KEY_PATH:-}
      FORENSIC_PDF_NODE: ${FORENSIC_PDF_NODE:-}
      FORENSIC_PDF_PLAYWRIGHT_DIR: ${FORENSIC_PDF_PLAYWRIGHT_DIR:-}
      FORENSIC_PDF_TIMEOUT_SECONDS: ${FORENSIC_PDF_TIMEOUT_SECONDS:-30}
      FORENSIC_REPORT_EVIDENCE: ${FORENSIC_REPORT_EVIDENCE:-false}
      FORENSIC_REPORT_FFMPEG: ${FORENSIC_REPORT_FFMPEG:-}
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-120}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-128}
      SESSION_CREATE_LIMIT: ${SESSION_CREATE_LIMIT:-3}
      SESSION_CREATE_WINDOW_SECONDS: ${SESSION_CREATE_WINDOW_SECONDS:-3600}
      SESSION_RATE_MAX_CLIENTS: ${SESSION_RATE_MAX_CLIENTS:-10000}
      THRESHOLDS_CONFIG: /app/ml/configs/thresholds.yaml
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ${DATA_DIR:-./data}:/data:ro
      - ${MEDIA_DIR:-./tmp/media}:/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ${WEB_ASSETS_DIR:-./apps/web/public/mediapipe}:/app/apps/web/public/mediapipe:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pg_data:
