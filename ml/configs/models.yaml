# Mô hình đang dùng cho từng module. "mock" = mô-đun giả lập (PLAT-03).
# Khi task mô hình thật xong, đổi thành id trong models/manifest.yaml và phiên bản đã tinh chỉnh.
modules:
  quality: scrfd-10g      # FACE-02 (MVP, ADR-0012): cổng chất lượng server dùng SCRFD det_10g
  face_pad: minifasnet    # FACE-01 bước 1: MiniFASNet V2 + SCRFD det_10g (chưa tinh chỉnh)
  face_deepfake: gend-clip-l14 # FACE-02: wrapper GenD (chưa tinh chỉnh; + sbi-ffc23 ở FACE-03)
  chromapulse: mock       # PRES-02
  camprobe: camprobe-rules  # PRES-03: bộ luật, không trọng số
  voice_spoof: antideepfake-mms300m # VOICE-01 wrapper only; R3 pending
  voice_challenge: phowhisper # VOICE-04; CTC alignment belongs to VOICE-05
  lipsync: syncnet        # VOICE-05: LatentSync stable_syncnet + CTC forced aligner
  provenance: audioseal-detector # FOR-03: AudioSeal + C2PA (extra forensic/c2pa); Perth chưa hỗ trợ
  gaze_tracking: mediapipe-face-landmarker # LIVE-02: opt-in, chưa nằm trong profile MVP/full
  head_turn: mediapipe-face-landmarker # FLOW-04: kiểm thứ tự; không chứng minh chiều sâu
  face_match: lvface-b # FLOW-05: diagnostic, cần artifact ngưỡng mới có thể pass

gaze:
  model_subdir: mediapipe-face-landmarker
  model_file: face_landmarker.task
  sha256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff

# Opt-in offline diagnostic, not the HTTP full/MVP face_pad selection above.
diagnostic_models:
  face_pad: fs-vfm-vit-l-fas
  chromapulse: chromapulse-diagnostic@0.1+face-landmarker-f16-1
  voice_challenge: qwen3-asr-06b-hf
  voice_spoof: nes2net-x-xlsr

