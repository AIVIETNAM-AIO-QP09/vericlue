[project]
name = "vericlue-ml"
version = "0.1.0"
description = "VeriClue — bộ não phát hiện giả mạo (khuôn mặt, giọng nói, hiện diện, quyết định, giám định)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
# Thư viện nặng chỉ cài khi làm task mô hình thật (FACE-*, VOICE-*, PRES-*).
# Thêm phiên bản cụ thể ở các task đó.
face = [
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  # FACE-02 (GenD): CLIP ViT-L/14 qua transformers; cùng ràng buộc với extra `voice`.
  "torch>=2.6,<3",
  "safetensors>=0.5,<1",
  "transformers>=4.57.1,<5",
  "pillow>=10,<13",
]
voice = [
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "safetensors>=0.5,<1",
  "transformers>=4.57.1,<5",
  "soundfile>=0.13,<1",
  "webrtcvad-wheels>=2.0.14,<3",
  "jiwer>=4,<5",
  "rapidfuzz>=3,<4",
]
eval = ["matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vericlue_ml"]
