[project]
name = "vericlue-ml"
version = "0.1.0"
description = "VeriClue — bộ não phát hiện giả mạo (khuôn mặt, giọng nói, hiện diện, quyết định, giám định)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Thư viện nặng chỉ cài khi làm task mô hình thật (FACE-*, VOICE-*, PRES-*).
# Thêm phiên bản cụ thể ở các task đó.
face = []
voice = []

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vericlue_ml"]
