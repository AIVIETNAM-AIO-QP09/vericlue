[project]
name = "vericlue-ml"
version = "0.1.0"
description = "VeriClue — bộ não phát hiện giả mạo (khuôn mặt, giọng nói, hiện diện, quyết định, giám định)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
# Thư viện nặng chỉ cài khi làm task mô hình thật (FACE-*, VOICE-*, PRES-*).
# Thêm phiên bản cụ thể ở các task đó.
face = [
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
]
# FACE-02 (GenD): CLIP ViT-L/14 qua transformers. Nặng (kéo torch), nên KHÔNG nằm trong `face`; CI chỉ cài
# `face`. Máy chạy GenD thật cần `--extra face --extra gend` (CPU) hoặc `--extra cuda` (GPU).
gend = [
  "torch>=2.6,<3",
  "safetensors>=0.5,<1",
  "transformers>=4.57.1,<5",
  "pillow>=10,<13",
]
voice = [
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "safetensors>=0.5,<1",
  "transformers>=4.57.1,<5",
  "soundfile>=0.13,<1",
  "webrtcvad-wheels>=2.0.14,<3",
  "jiwer>=4,<5",
  "rapidfuzz>=3,<4",
]
# FOR-03: quét thủy vân AudioSeal (MIT). Cần thêm extra voice (torch, soundfile) để chạy.
forensic = ["audioseal>=0.2.0,<0.3"]
# FOR-03: đọc manifest C2PA (MIT OR Apache-2.0). Wheel Windows ~88 MB nên tách riêng; thiếu thì C2PA ghi "chưa cài".
c2pa = ["c2pa-python>=0.38,<0.39"]
eval = ["matplotlib>=3.9,<4"]
# Bản GPU (RTX, CUDA 13), chỉ cho máy demo Windows: THAY cho `face` + `gend` + `voice` (cùng gói, nhưng
# torch/torchaudio lấy từ index PyTorch cu130 và onnxruntime-gpu thay onnxruntime). Xung đột với ba extra
# kia (khai báo ở pyproject gốc), nên cài một trong hai: `uv sync --all-packages --extra cuda`.
# Mặc định và CI không dùng. Giữ danh sách khớp `face` ∪ `gend` ∪ `voice` (test: ml/tests/test_device.py).
cuda = [
  "onnxruntime-gpu[cuda,cudnn]>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "safetensors>=0.5,<1",
  "transformers>=4.57.1,<5",
  "pillow>=10,<13",
  "soundfile>=0.13,<1",
  "webrtcvad-wheels>=2.0.14,<3",
  "jiwer>=4,<5",
  "rapidfuzz>=3,<4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "cuda" }]
torchaudio = [{ index = "pytorch-cu130", extra = "cuda" }]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vericlue_ml"]
