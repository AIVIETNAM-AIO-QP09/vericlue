name: Android face UI

on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android-face-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-face-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Face UI snapshots and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon lintDebug recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-face-ui-report
          path: |
            apps/android/app/build/reports/paparazzi/
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/tests/
            apps/android/app/src/test/snapshots/images/
          retention-days: 7
