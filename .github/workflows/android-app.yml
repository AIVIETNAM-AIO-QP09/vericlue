name: Android VeriClue APK

on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android-app.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: VeriClue APK (one package, stable signer)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    env:
      VERICLUE_API_BASE_URL: ${{ vars.VERICLUE_REMOTE_API_URL || 'http://localhost:8421/' }}
      VERICLUE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VERICLUE_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the persistent demo signer
        id: signer
        env:
          SIGNING_STORE: ${{ secrets.VERICLUE_ANDROID_KEYSTORE_B64 }}
        run: |
          python - <<'PY'
          import base64, os, re
          from pathlib import Path
          url = os.environ['VERICLUE_API_BASE_URL']
          if url != 'http://localhost:8421/' and not re.fullmatch(r'https://[a-z0-9-]+(?:\.[a-z0-9-]+)*\.ts\.net/', url):
              raise SystemExit('Use localhost:8421 or the private Tailscale HTTPS endpoint')
          ready = bool(os.environ.get('SIGNING_STORE') and os.environ.get('VERICLUE_ANDROID_KEYSTORE_PASSWORD'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              print('::notice::Build/test only: publishing waits for explicit approval to configure the stable signing secrets')
              raise SystemExit(0)
          path = Path(os.environ['RUNNER_TEMP']) / 'vericlue-demo.p12'
          path.write_bytes(base64.b64decode(os.environ['SIGNING_STORE'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write('VERICLUE_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Test and build VeriClue
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            "-Pvericlue.apiBaseUrl=$VERICLUE_API_BASE_URL" -Pvericlue.signedMedia=true
      - name: Check package, signer, endpoint and artifact checksum
        if: steps.signer.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          apk = Path('app/build/outputs/apk/debug/app-arm64-v8a-debug.apk')
          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          tools = sorted((sdk / 'build-tools').iterdir())[-1]
          badging = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          assert "package: name='vn.vericlue.app'" in badging
          assert "application-label:'VeriClue'" in badging
          cert = subprocess.check_output([str(tools / 'apksigner'), 'verify', '--print-certs', str(apk)], text=True)
          signer = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)', cert).group(1)
          assert signer == Path('demo-signing-cert.sha256').read_text().strip()
          generated = list(Path('app/build/generated').rglob('BuildConfig.java'))
          url = os.environ['VERICLUE_API_BASE_URL']
          assert any(url in p.read_text() and re.search(r'SIGNED_MEDIA\s*=\s*true', p.read_text()) for p in generated)
          with zipfile.ZipFile(apk) as archive:
              assert not any('text-recognition' in name for name in archive.namelist())
          out = Path('vericlue-apk')
          out.mkdir()
          target = out / 'VeriClue.apk'
          shutil.copy2(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(digest + '  VeriClue.apk\n')
          (out / 'build-info.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'api_base_url': url, 'application_id': 'vn.vericlue.app', 'label': 'VeriClue',
              'signed_media': True, 'signer_sha256': signer, 'hardware_acceptance': 'not_verified',
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.signer.outputs.ready == 'true'
        with:
          name: vericlue-android
          path: apps/android/vericlue-apk/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'vericlue-demo.p12').unlink(missing_ok=True)
          PY
