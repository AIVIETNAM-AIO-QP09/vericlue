name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials:
    name: Credentials (${{ matrix.os }}, real crypto)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: services/credentials
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/credentials/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: CLI comparison, synthetic credentials only
        run: node cli.mjs demo --runs 2

  python:
    name: Python (lint + test) + kiểm tra kế hoạch
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vericlue_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: vericlue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vericlue_test -d vericlue_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (Python 3.12 + thư viện, đúng uv.lock)
        run: uv sync --all-packages --extra face --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Kiểm tra kế hoạch (backlog ↔ task card, phụ thuộc, tải, đường găng)
        run: uv run python scripts/plan_check.py
      - name: openapi.json khớp code (chạy lại gen_openapi không được tạo khác biệt)
        run: uv run python scripts/gen_openapi.py && git diff --exit-code -- packages/contracts/openapi.json
      - name: FFmpeg cho kiểm tra ảnh/phổ báo cáo (công cụ CI, không đóng gói sản phẩm)
        timeout-minutes: 6
        run: |
          if ! /usr/bin/ffmpeg -version >/dev/null 2>&1; then
            # Avoid the runner's mirror redirector: slow archive downloads can exceed the budget.
            # A job-local source list keeps the runner configuration intact; APT verifies Ubuntu signatures.
            . /etc/os-release
            apt_sources="$RUNNER_TEMP/vericlue-ubuntu.list"
            printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu %s main universe\n' \
              "$VERSION_CODENAME" "${VERSION_CODENAME}-updates" "${VERSION_CODENAME}-security" > "$apt_sources"
            apt_options=(
              -o "Dir::Etc::sourcelist=$apt_sources" -o Dir::Etc::sourceparts=-
              -o Acquire::Languages=none -o Acquire::Retries=1
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
              -o Dpkg::Lock::Timeout=30
            )
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi
          /usr/bin/ffmpeg -version
      - name: Test (mô-đun giả lập, CPU)
        env:
          USE_MOCK_MODELS: "true"
          # Ephemeral test database only; deployment passwords remain in local .env.
          TEST_DATABASE_URL: postgresql+psycopg://vericlue_test:ci-only-not-a-secret@127.0.0.1:5432/vericlue_test
          TEST_FFMPEG_BINARY: /usr/bin/ffmpeg
        run: uv run pytest

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Check web project exists
        id: has_web
        working-directory: .
        run: test -f apps/web/package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.yes == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.has_web.outputs.yes == 'true'
        run: npm ci
      - if: steps.has_web.outputs.yes == 'true'
        run: npm run lint
      - if: steps.has_web.outputs.yes == 'true'
        run: npm run typecheck
      - if: steps.has_web.outputs.yes == 'true'
        run: npm run format:check
      - name: Type API khớp openapi.json (chạy lại gen:api không được tạo khác biệt)
        if: steps.has_web.outputs.yes == 'true'
        run: npm run gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - if: steps.has_web.outputs.yes == 'true'
        run: npm run test --if-present
      - if: steps.has_web.outputs.yes == 'true'
        run: npm run build

  pdf:
    name: PDF (Chromium Windows, offline resources)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - name: Worker Chromium thật, chặn tài nguyên mạng và gói lỗi
        run: node --test ../../services/api/tests/pdf_worker.test.cjs

  guard:
    name: Guard (no data/secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block large or forbidden files
        run: |
          bad=$(git ls-files | grep -E '\.(onnx|pt|pth|ckpt|safetensors|wav|mp3|mp4|webm|m4a|npz)$' | grep -v '/fixtures/' || true)
          if [ -n "$bad" ]; then echo "Forbidden files committed:"; echo "$bad"; exit 1; fi
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env committed"; exit 1; fi
          big=$(git ls-files -z | xargs -0 du -k 2>/dev/null | awk '$1 > 2048 {print $2}' | grep -v '\.pdf$' || true)
          if [ -n "$big" ]; then echo "Files > 2MB:"; echo "$big"; exit 1; fi

  android:
    name: Android (unit test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (logic, API với MockWebServer, đối chiếu hợp đồng, chữ cấm) + build APK debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: apps/android/app/build/reports/tests/
