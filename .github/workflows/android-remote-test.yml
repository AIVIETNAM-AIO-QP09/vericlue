name: Android remote test APK

on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android-remote-test.yml
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Private Tailscale Serve HTTPS URL ending in /
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-apk:
    name: Android remote APK (signed media, mock-server test)
    if: github.event_name == 'workflow_dispatch' || vars.VERICLUE_REMOTE_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    env:
      VERICLUE_API_BASE_URL: ${{ inputs.api_base_url || vars.VERICLUE_REMOTE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate private HTTPS endpoint
        run: |
          python - <<'PY'
          import os
          import re
          value = os.environ.get('VERICLUE_API_BASE_URL', '')
          # No credentials, path, query, shell characters or public tunnel input.
          if not re.fullmatch(r'https://[a-z0-9-]+(?:\.[a-z0-9-]+)*\.ts\.net/', value):
              raise SystemExit('Set a private Tailscale Serve HTTPS base URL ending in /')
          print('Private HTTPS endpoint validated; no network credential is embedded')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build internal APK with media signatures enabled
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            "-Pvericlue.apiBaseUrl=$VERICLUE_API_BASE_URL" \
            -Pvericlue.signedMedia=true
      - name: Verify artifact endpoint and record source/checksum
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import zipfile
          from pathlib import Path
          url = os.environ['VERICLUE_API_BASE_URL']
          generated = list(Path('app/build/generated').rglob('BuildConfig.java'))
          assert any(url in p.read_text() and re.search(r'SIGNED_MEDIA\s*=\s*true', p.read_text()) for p in generated), 'Build config mismatch'
          apk = Path('app/build/outputs/apk/debug/app-arm64-v8a-debug.apk')
          with zipfile.ZipFile(apk) as archive:
              assert any(url.encode() in archive.read(n) for n in archive.namelist() if n.startswith('classes') and n.endswith('.dex')), 'APK does not contain the intended endpoint'
          out = Path('remote-test')
          out.mkdir()
          target = out / 'vericlue-remote-debug-arm64-v8a.apk'
          shutil.copy2(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(digest + '  ' + target.name + '\n')
          (out / 'build-info.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'api_base_url': url,
              'signed_media': True,
              'variant': 'debug',
              'expected_server_mode': 'synthetic/mock',
              'hardware_acceptance': 'not_verified',
          }, indent=2) + '\n')
          print('APK verified; source metadata and checksum written')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vericlue-android-remote-test
          path: apps/android/remote-test/
          if-no-files-found: error
          retention-days: 7
      - name: Save unit-test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-remote-test-report
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
