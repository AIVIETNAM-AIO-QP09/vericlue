name: Android USB test APK

on:
  pull_request:
    paths:
      - apps/android/**
      - .github/workflows/android-usb-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-usb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  usb-apk:
    name: Android USB APK (separate app, signed media)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build separate USB app
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -Pvericlue.usbTest=true \
            -Pvericlue.apiBaseUrl=http://localhost:8421/ \
            -Pvericlue.signedMedia=true
      - name: Verify USB profile cannot be released
        run: |
          if ./gradlew --no-daemon :app:checkReleaseApiUrl \
            -Pvericlue.usbTest=true \
            -Pvericlue.apiBaseUrl=http://localhost:8421/ \
            -Pvericlue.signedMedia=true > usb-release-guard.log 2>&1; then
            echo 'USB release guard did not reject the build'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          assert 'USB test is debug-only.' in Path('usb-release-guard.log').read_text()
          PY
      - name: Verify package, endpoint, signatures flag and source metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path
          url = 'http://localhost:8421/'
          package = 'vn.vericlue.app.usbtest'
          generated = list(Path('app/build/generated').rglob('BuildConfig.java'))
          assert any(url in p.read_text() and package in p.read_text() and re.search(r'SIGNED_MEDIA\s*=\s*true', p.read_text()) for p in generated)
          apk = Path('app/build/outputs/apk/debug/app-arm64-v8a-debug.apk')
          sdk = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          aapt = sorted((sdk / 'build-tools').glob('*/aapt'))[-1]
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          assert "package: name='" + package + "'" in badging
          assert "application-label:'VeriClue USB'" in badging
          with zipfile.ZipFile(apk) as archive:
              assert any(url.encode() in archive.read(n) for n in archive.namelist() if n.startswith('classes') and n.endswith('.dex'))
          out = Path('usb-test')
          out.mkdir()
          target = out / 'vericlue-usb-debug-arm64-v8a.apk'
          shutil.copy2(apk, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(digest + '  ' + target.name + '\n')
          (out / 'build-info.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'api_base_url': url,
              'application_id': package,
              'label': 'VeriClue USB',
              'signed_media': True,
              'variant': 'debug',
              'transport': 'adb reverse tcp:8421 tcp:8421',
              'hardware_acceptance': 'not_verified',
          }, indent=2) + '\n')
          print('Separate USB package, endpoint, media flag and checksum verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vericlue-android-usb-test
          path: apps/android/usb-test/
          if-no-files-found: error
          retention-days: 7
      - name: Save test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-usb-test-report
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
