    owner: M3

  - id: gend-clip-l14
    purpose: Deepfake khuôn mặt — mô hình chính
    source: hf:yermandy/GenD_CLIP_L_14
    license: MIT
    owner: M3

  - id: sbi-ffc23
    purpose: Deepfake khuôn mặt — dự phòng, nguồn heatmap
    source: gdrive (xem external/repos.yaml -> SelfBlendedImages README)
    license: research-only (nc)
    owner: M3

  - id: scrfd-10g
    purpose: Dò và căn chỉnh khuôn mặt cho GenD
    source: hf/insightface buffalo_l det_10g.onnx
    license: research-only (nc)
    owner: M3

  - id: antideepfake-mms300m
    purpose: Giọng giả — mô hình nền
    source: hf:nii-yamagishilab/mms-300m-anti-deepfake
    license: CC BY-NC-SA 4.0 (nc)
    owner: M4

  - id: phowhisper
    purpose: Nhận dạng câu đọc tiếng Việt
    source: hf:vinai/PhoWhisper-small  # GPU: hf:kiendt/PhoWhisper-large-ct2
    license: BSD-3-Clause
    owner: M4

  - id: ctc-aligner
