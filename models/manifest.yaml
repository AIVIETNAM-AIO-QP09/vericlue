    source: pip:ctc-forced-aligner (mms-300m-1130-forced-aligner)
    license: BSD-2-Clause / CC BY-NC (mô hình MMS)
    owner: M4

  - id: syncnet
    purpose: Khớp môi–âm
    source: hf:ByteDance/LatentSync-1.6 (stable_syncnet.pt)
    license: Apache-2.0
    owner: M4

  - id: audioseal-detector
    purpose: Dò thủy vân AudioSeal
    source: pip:audioseal
    license: MIT
    owner: M4

  - id: perth
