[project]
name = "vericlue-api"
version = "0.1.0"
description = "VeriClue — máy chủ API: phiên eKYC, bàn duyệt, giám định"
requires-python = ">=3.12,<3.13"
dependencies = [
  "vericlue-ml",
  "fastapi>=0.115",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=50.0.2,<51",
  "pillow>=10,<13",
]

[tool.uv.sources]
vericlue-ml = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vericlue_api"]
